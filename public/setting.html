<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - ParkirScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="/"
                    class="bg-indigo-700 hover:bg-indigo-800 p-2 rounded-lg border border-indigo-500 shadow-sm flex items-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="font-bold text-lg">Pengaturan Sistem</h1>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Setting Tarif Parkir Cash -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-slate-800 text-sm">Tarif Parkir (Cash & General)</h2>
            <div>
                <label class="text-xs text-slate-500 font-medium block mb-1">Tarif Aktif (Rp)</label>
                <input type="number" id="settingFee"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button onclick="saveTarifWithPin()"
                class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-semibold hover:bg-slate-700">
                Simpan Tarif Baru
            </button>
        </div>

        <!-- Setting Status & Foto QRIS -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-800 text-sm">Metode Pembayaran QRIS</h2>
                    <p class="text-[10px] text-slate-400">Aktifkan untuk menampilkan pembayaran QRIS</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggleQris" onchange="toggleQrisWithPin()" class="sr-only peer">
                    <div
                        class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600">
                    </div>
                </label>
            </div>

            <!-- Previews & Upload Gambar QRIS -->
            <div id="qrisConfigSection" class="space-y-3 border-t pt-3">
                <p class="text-xs font-semibold text-slate-700">Foto QRIS Toko / Merchant</p>
                <div class="bg-slate-50 p-3 rounded-xl border border-dashed border-slate-300 text-center">
                    <img id="qrisPreview" src="" alt="QRIS Merchant"
                        class="w-40 h-40 mx-auto rounded-lg object-cover hidden">
                    <p id="noQrisText" class="text-xs text-slate-400 py-6">Belum ada foto QRIS diupload</p>
                </div>
                <input type="file" id="qrisFileInput" accept="image/*" class="hidden" onchange="uploadQrisImage()">
                <button onclick="triggerUploadQrisWithPin()"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-indigo-700">
                    Upload / Edit Foto QRIS
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL POPUP VERIFIKASI PIN -->
    <div id="pinModal"
        class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 space-y-4 text-center">
            <h3 class="font-bold text-slate-800 text-sm">Masukkan PIN Keamanan</h3>
            <p class="text-[11px] text-slate-400">Diperlukan PIN untuk mengubah konfigurasi sensitif (Default PIN: 1234)
            </p>

            <input type="password" id="pinInput" maxlength="6" placeholder="****"
                class="w-full text-center border border-slate-300 rounded-lg py-2 text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">

            <div class="flex gap-2">
                <button onclick="closePinModal()"
                    class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-lg text-xs font-semibold">Batal</button>
                <button onclick="submitPinVerification()"
                    class="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-indigo-700">Verifikasi</button>
            </div>
        </div>
    </div>

    <script>
        let pendingAction = null;
        let verifiedPin = '';

        async function loadSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();

            document.getElementById('settingFee').value = data.parking_fee || 5000;
            document.getElementById('toggleQris').checked = data.qris_active === '1';

            if (data.qris_image) {
                document.getElementById('qrisPreview').src = data.qris_image;
                document.getElementById('qrisPreview').classList.remove('hidden');
                document.getElementById('noQrisText').classList.add('hidden');
            }
        }

        function openPinModal(actionCallback) {
            pendingAction = actionCallback;
            document.getElementById('pinInput').value = '';
            document.getElementById('pinModal').classList.remove('hidden');
        }

        function closePinModal() {
            document.getElementById('pinModal').classList.add('hidden');
            pendingAction = null;
        }

        async function submitPinVerification() {
            const pin = document.getElementById('pinInput').value;
            const res = await fetch('/api/settings/verify-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin })
            });

            if (res.ok) {
                verifiedPin = pin;
                closePinModal();
                if (pendingAction) pendingAction();
            } else {
                alert('PIN Salah!');
            }
        }

        function saveTarifWithPin() {
            openPinModal(async () => {
                const fee = document.getElementById('settingFee').value;
                await fetch('/api/settings/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: verifiedPin, parking_fee: fee })
                });
                alert('Tarif berhasil diperbarui!');
            });
        }

        function toggleQrisWithPin() {
            const isChecked = document.getElementById('toggleQris').checked;
            openPinModal(async () => {
                await fetch('/api/settings/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: verifiedPin, qris_active: isChecked ? '1' : '0' })
                });
            });
        }

        function triggerUploadQrisWithPin() {
            openPinModal(() => {
                document.getElementById('qrisFileInput').click();
            });
        }

        async function uploadQrisImage() {
            const fileInput = document.getElementById('qrisFileInput');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('qris_image', fileInput.files[0]);

            const res = await fetch('/api/settings/upload-qris', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById('qrisPreview').src = data.image_url;
                document.getElementById('qrisPreview').classList.remove('hidden');
                document.getElementById('noQrisText').classList.add('hidden');
                alert('Foto QRIS Berhasil Diupload!');
            }
        }

        loadSettings();
    </script>
</body>

</html>
