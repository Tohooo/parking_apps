<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akun Pengelola - ParkirScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <a href="/"
                class="bg-indigo-700 hover:bg-indigo-800 p-2 rounded-lg border border-indigo-500 shadow-sm flex items-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="font-bold text-lg">Akun Pengelola Parkir</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- KONDISI 1: BELUM LOGIN -->
        <div id="sectionUnauthenticated"
            class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-5">
            <div class="space-y-1">
                <h2 class="font-bold text-lg text-slate-800">Selamat Datang!</h2>
                <p class="text-xs text-slate-500">Silakan login atau daftar akun untuk mengelola usaha parkir Anda.</p>
            </div>

            <div class="space-y-3 pt-2">
                <!-- Elemen Container Google One Tap -->
                <div id="g_id_onload"
                    data-client_id="267296184458-ttfhvd1bupunro0ogb1d2hji35j6eif6.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse" data-auto_prompt="false">
                </div>

                <button onclick="triggerGoogleSignIn()"
                    class="w-full border border-slate-300 hover:bg-slate-50 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-sm transition-all text-slate-700">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Daftar / Login via Google
                </button>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-2 text-[10px] text-slate-400 font-semibold">ATAU</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- Opsi Nomor HP & OTP -->
                <div class="space-y-2 text-left">
                    <label class="text-xs font-semibold text-slate-700">Nomor HP Aktif</label>
                    <div class="flex gap-2">
                        <input type="tel" id="inputPhone" placeholder="081234567890"
                            class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="requestOTP()"
                            class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-indigo-700">Lanjut</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- STAGE OTP (VERIFIKASI NO HP) -->
        <div id="stepVerifyOtp" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 hidden">
            <h2 class="font-bold text-base text-slate-800">Verifikasi Kode OTP</h2>
            <p class="text-xs text-slate-500">Kode verifikasi dikirimkan ke <b id="displayPhone"></b></p>

            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-700">Kode Verifikasi (6 Digit)</label>
                <input type="text" id="otpCodeInput" maxlength="6" placeholder="123456"
                    class="w-full text-center border border-slate-300 rounded-xl px-3 py-2 text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button onclick="submitOTP()"
                class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-700 transition-all">
                Verifikasi & Masuk
            </button>
        </div>

        <!-- STAGE PROFIL PENGELOLA (SUDAH LOGIN) -->
        <div id="sectionAuthenticated" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="font-bold text-slate-800 text-sm">Data Profil Pengelola Parkir</h2>
                    <span id="badgeAuthType"
                        class="text-[9px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold uppercase"></span>
                </div>

                <form id="profileForm" onsubmit="saveProfile(event)" class="space-y-3">
                    <div>
                        <label class="text-[11px] font-medium text-slate-500 block mb-1">Nama Lengkap Pengelola</label>
                        <input type="text" id="profName" required placeholder="Contoh: Budi Santoso"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] font-medium text-slate-500 block mb-1">Tanggal Lahir</label>
                            <input type="date" id="profBirth" required
                                class="w-full border border-slate-300 rounded-lg px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="text-[11px] font-medium text-slate-500 block mb-1">Nomor HP Aktif</label>
                            <input type="tel" id="profPhone" required placeholder="08123456789"
                                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="text-[11px] font-medium text-slate-500 block mb-1">Alamat Email</label>
                        <input type="email" id="profEmail" required placeholder="nama@email.com"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="text-[11px] font-medium text-slate-500 block mb-1">Alamat Lokasi Lahan
                            Parkir</label>
                        <textarea id="profAddress" rows="2" required placeholder="Jl. Merdeka No. 12, Palembang"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-700 shadow-md transition-all">
                        Simpan Perubahan Profil
                    </button>
                </form>
            </div>

            <button onclick="logout()"
                class="w-full bg-rose-50 text-rose-600 border border-rose-200 py-2.5 rounded-xl text-xs font-bold hover:bg-rose-100 transition-all">
                Keluar / Logout Akun
            </button>
        </div>

    </main>

    <script>
        // DEKLARASI VARIABEL UTAMA HARUS DI BARIS PERTAMA SCRIPT
        var currentUser = null;
        try {
            currentUser = JSON.parse(localStorage.getItem('parkir_user') || 'null');
        } catch (e) {
            currentUser = null;
        }

        function checkAuthStatus() {
            const token = localStorage.getItem('parkir_token');
            if (token && currentUser) {
                document.getElementById('sectionUnauthenticated').classList.add('hidden');
                document.getElementById('stepVerifyOtp').classList.add('hidden');
                document.getElementById('sectionAuthenticated').classList.remove('hidden');

                document.getElementById('badgeAuthType').innerText = `Login via ${currentUser.auth_type || 'Google'}`;
                document.getElementById('profName').value = currentUser.full_name || '';
                document.getElementById('profBirth').value = currentUser.birth_date || '';
                document.getElementById('profPhone').value = currentUser.phone_number || '';
                document.getElementById('profEmail').value = currentUser.email || '';
                document.getElementById('profAddress').value = currentUser.parking_address || '';
            } else {
                document.getElementById('sectionUnauthenticated').classList.remove('hidden');
                document.getElementById('stepVerifyOtp').classList.add('hidden');
                document.getElementById('sectionAuthenticated').classList.add('hidden');
            }
        }

        function triggerGoogleSignIn() {
            if (window.google && window.google.accounts) {
                const clientId = document.getElementById('g_id_onload').getAttribute('data-client_id');
                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: handleCredentialResponse
                });
                google.accounts.id.prompt();
            } else {
                alert("SDK Google belum siap, silakan muat ulang halaman.");
            }
        }

        async function handleCredentialResponse(response) {
            try {
                const res = await fetch('/api/auth/google-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('parkir_token', data.token);
                    localStorage.setItem('parkir_user', JSON.stringify(currentUser));
                    checkAuthStatus();
                } else {
                    alert(data.error || 'Gagal memverifikasi akun Google.');
                }
            } catch (e) {
                alert('Terjadi kesalahan sistem saat verifikasi Google: ' + e.message);
            }
        }

        async function requestOTP() {
            const phone = document.getElementById('inputPhone').value.trim();
            if (!phone) return alert('Masukkan nomor HP terlebih dahulu!');

            const res = await fetch('/api/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone_number: phone })
            });

            const data = await res.json();
            if (data.success) {
                alert(`[SIMULASI OTP] Kode Verifikasi: ${data.debug_otp}`);
                document.getElementById('displayPhone').innerText = phone;
                document.getElementById('sectionUnauthenticated').classList.add('hidden');
                document.getElementById('stepVerifyOtp').classList.remove('hidden');
            }
        }

        async function submitOTP() {
            const phone = document.getElementById('inputPhone').value.trim();
            const otpCode = document.getElementById('otpCodeInput').value.trim();

            const res = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone_number: phone, otp: otpCode })
            });

            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('parkir_token', data.token);
                localStorage.setItem('parkir_user', JSON.stringify(currentUser));
                checkAuthStatus();
            } else {
                alert(data.error || 'Kode OTP Salah!');
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            if (!currentUser || !currentUser.id) return alert('Sesi berakhir, silakan login ulang');

            const payload = {
                id: currentUser.id,
                full_name: document.getElementById('profName').value,
                birth_date: document.getElementById('profBirth').value,
                phone_number: document.getElementById('profPhone').value,
                email: document.getElementById('profEmail').value,
                parking_address: document.getElementById('profAddress').value
            };

            const res = await fetch('/api/auth/update-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('parkir_user', JSON.stringify(currentUser));
                alert('Data profil pengelola berhasil diperbarui!');
            }
        }

        function logout() {
            localStorage.removeItem('parkir_token');
            localStorage.removeItem('parkir_user');
            currentUser = null;
            checkAuthStatus();
        }

        // Inisialisasi awal
        checkAuthStatus();
    </script>
</body>

</html>
